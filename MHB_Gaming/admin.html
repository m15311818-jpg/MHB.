<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHB Admin</title>
<style>
:root{--bg:#090b18;--panel:#151b30;--line:#303a59;--purple:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#25204a,transparent 35%),var(--bg);color:#f7f7ff;font-family:Tahoma,Arial,sans-serif}header{padding:22px 5%;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between}.logo{font-size:26px;font-weight:900}.logo span{color:var(--cyan)}main{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}input,select{background:#0b1022;border:1px solid #394363;border-radius:10px;padding:12px;color:white;width:100%;margin:8px 0}button{border:0;border-radius:10px;padding:11px 16px;color:white;background:linear-gradient(90deg,var(--purple),#536dff);cursor:pointer;margin:4px}button.danger{background:#a83252}button.ok{background:#087d72}.muted{color:#aab2cc}.hidden{display:none!important}.item{padding:14px;border:1px solid #35405f;border-radius:12px;margin:10px 0;background:#0d1428}.item b{color:#b9a2ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
</style></head><body><header><div class="logo">MHB<span>.</span> ADMIN</div><span>لوحة الإدارة</span></header><main>
<section class="card" id="login"><h2>دخول الإدارة</h2><p class="muted">استخدم بريد وكلمة مرور حساب الأدمن الذي أنشأته في Supabase.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginBtn">تسجيل الدخول</button><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="card"><h2>إعدادات المنصة</h2><p class="muted">إعدادات عامة — استخدمها للنقاط الافتراضية فقط.</p><label>اسم المنصة</label><input value="MHB Gaming" disabled><button id="refresh">تحديث البيانات</button><button class="danger" id="logout">تسجيل الخروج</button></div>
<div class="grid"><section class="card"><h2>طلبات انضمام اللاعبين</h2><div id="players">جارٍ التحميل...</div></section><section class="card"><h2>طلبات المباريات</h2><div id="matches">جارٍ التحميل...</div></section></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ubqrdtqrhwmbyotmckpi.supabase.co",SUPABASE_ANON_KEY="sb_publishable_ZgBUZSj9a1GGXBkY8YuAuw_0VThuNk0";
const configured=!SUPABASE_URL.startsWith("PASTE_")&&!SUPABASE_ANON_KEY.startsWith("PASTE_");const db=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;const $=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{if(!db){$("loginMsg").textContent="أضف بيانات Supabase أولاً.";return;}const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginMsg").textContent=error.message;return;}await load();};
async function load(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:role}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(!role){$("loginMsg").textContent="هذا الحساب ليس ضمن قائمة الأدمن. أضف user_id إلى جدول admin_users من SQL Editor.";await db.auth.signOut();return;}$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await refresh();}
async function refresh(){const {data:ps,error:pe}=await db.from("players").select("id,full_name,phone,status,points,created_at").order("created_at",{ascending:false});$("players").innerHTML=pe?pe.message:"";(ps||[]).forEach(p=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${esc(p.full_name)}</b><br>الهاتف: ${esc(p.phone)}<br>الحالة: ${esc(p.status)}<br>النقاط: ${p.points}<br><small>${p.id}</small>`;if(p.status!=="approved"){let b=document.createElement("button");b.className="ok";b.textContent="موافقة";b.onclick=()=>approve(p.id);d.append(b);let r=document.createElement("button");r.className="danger";r.textContent="رفض";r.onclick=()=>reject(p.id);d.append(r);} $("players").append(d);});
const {data:ms,error:me}=await db.from("match_requests").select("*").order("created_at",{ascending:false});$("matches").innerHTML=me?me.message:"";(ms||[]).forEach(m=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${esc(m.game)}</b> — ${esc(m.mode)}<br>اللاعب: ${m.player_id}<br>الحالة: ${esc(m.status)}<br>كود الطلب: ${m.id}`;$("matches").append(d);});}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function approve(id){const {error}=await db.from("players").update({status:"approved"}).eq("id",id);if(error)alert(error.message);await refresh();}
async function reject(id){const {error}=await db.from("players").update({status:"rejected"}).eq("id",id);if(error)alert(error.message);await refresh();}
$("refresh").onclick=refresh;$("logout").onclick=async()=>{await db.auth.signOut();location.reload();};
if(configured)db.auth.getUser().then(x=>{if(x.data.user)load();});
</script></body></html>
